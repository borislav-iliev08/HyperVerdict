{% extends 'base.html' %}
{% block title %}Change Your Password | HyperVerdict{% endblock %}
{% block content %}
<section class="auth-page password-auth-page">
    <article class="auth-card password-auth-card">
        <a class="auth-brand brand" href="{% url 'home' %}" aria-label="HyperVerdict home"><span class="brand-mark">H</span><span>Hyper<span class="brand-accent">Verdict</span></span></a>
        <div class="eyebrow"><span class="eyebrow-line"></span> ACCOUNT SECURITY</div>
        <h1>Change Your Password</h1>
        <p class="auth-subtitle">Update your current account password to keep your HyperVerdict account secure.</p>
        <form method="post" class="auth-form password-auth-form">
            {% csrf_token %}
            {{ form }}
            <button type="submit" class="button auth-submit">Update Password <span aria-hidden="true">&rarr;</span></button>
        </form>
    </article>
</section>
{% endblock %}
