{% load static %}
<header class="site-header">
    <div class="header-inner">
        <a class="brand" href="/" aria-label="HyperVerdict home"><span class="brand-mark">H</span><span>Hyper<span class="brand-accent">Verdict</span></span></a>
        <input class="nav-toggle" type="checkbox" id="nav-toggle" aria-label="Toggle navigation">
        <label class="menu-button" for="nav-toggle" aria-label="Toggle navigation"><span></span><span></span><span></span></label>
        <div class="header-actions">
            {% if user.is_authenticated %}
                <a class="login-link profile-link" href="/accounts/profile/">
                    {% if user.profile.profile_picture %}
                        <img class="profile-avatar" src="{{ user.profile.profile_picture.url }}" alt="">
                    {% else %}
                        <img class="profile-avatar" src="{% static 'images/default-avatar.svg' %}" alt="">
                    {% endif %}
                    <span>My Profile</span>
                </a>

            {% else %}
                <a class="login-link" href="{% url 'login' %}">Log in</a>
                <a class="button button-small" href="{% url 'register' %}">Register</a>
            {% endif %}
        </div>
    </div>
</header>
